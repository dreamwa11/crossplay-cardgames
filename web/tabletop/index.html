html, body { margin: 0; height: 100%; background: #2b2b2e; }
body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; overflow: hidden; }
.device { background: #e8e6e1; border-radius: 26px; padding: 16px 16px 30px; box-shadow: 0 20px 50px #0008, inset 0 0 0 2px #fff6; position: relative; }
.device::after { content: 'M5Stack PaperMono · CrossPlay'; position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 11px; letter-spacing: .08em; color: #8a877f; }
canvas { display: block; image-rendering: pixelated; background: #fff; border-radius: 4px; touch-action: manipulation; cursor: pointer; }
/* On a phone the phone is the device: the panel fills the screen, no frame. */
@media (max-width: 600px), (display-mode: standalone) {
  html, body { background: #fff; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .device { background: none; box-shadow: none; padding: 0; border-radius: 0; }
  .device::after { display: none; }
  canvas { border-radius: 0; }
}

const W = 480, H = 800;
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const img = {};
// The firmware's Rubik cuts; fontconvert sizes are points at 150 dpi.
const FACES = { tile: 8, button: 12, ui: 17, display: 25, large: 37, huge: 53 };
const fontOf = (f, k = 1) => `${(FACES[f] * 150 / 72 * k).toFixed(2)}px Rubik`;
const capCache = {};
function capH(f) {
  if (capCache[f] == null) { ctx.font = fontOf(f); capCache[f] = ctx.measureText('H').actualBoundingBoxAscent; }
  return capCache[f];
}
function widthOf(text, f) { ctx.font = fontOf(f); return ctx.measureText(text).width; }
function fitFace(text, w, faces) { for (const f of faces) if (widthOf(text, f) <= w) return f; return faces[faces.length - 1]; }
function say(x, y, w, h, text, f, align = 'center', white = false) {
  let k = 1;
  ctx.font = fontOf(f);
  const tw = ctx.measureText(text).width;
  if (tw > w && w > 0) { k = w / tw; ctx.font = fontOf(f, k); }
  ctx.fillStyle = white ? '#fff' : '#000';
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  const tx = align === 'center' ? x + w / 2 : align === 'right' ? x + w : x;
  ctx.fillText(text, Math.round(tx), Math.round(y + (h + capH(f) * k) / 2));
}
// Up to two centred lines, broken at spaces.
function prose(x, y, w, h, text, f) {
  const words = text.split(' ');
  let lines = [text];
  if (widthOf(text, f) > w) {
    let best = null;
    for (let i = 1; i < words.length; ++i) {
      const a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
      const m = Math.max(widthOf(a, f), widthOf(b, f));
      if (!best || m < best[0]) best = [m, a, b];
    }
    if (best) lines = [best[1], best[2]];
  }
  const lh = capH(f) * 1.45;
  const top = y + (h - lh * lines.length) / 2;
  lines.forEach((l, i) => say(x, top + i * lh, w, lh, l, f));
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function fill(x, y, w, h, color, r = 0) { ctx.fillStyle = color; if (r) { rr(x, y, w, h, r); ctx.fill(); } else ctx.fillRect(x, y, w, h); }
function stroke(x, y, w, h, color, t, r = 0) {
  ctx.strokeStyle = color; ctx.lineWidth = t;
  rr(x + t / 2, y + t / 2, w - t, h - t, Math.max(0, r - t / 2)); ctx.stroke();
}
let greyPat = null;
function grey() {
  if (!greyPat) {
    const p = document.createElement('canvas'); p.width = p.height = 2;
    const pc = p.getContext('2d'); pc.fillStyle = '#000'; pc.fillRect(0, 0, 2, 2); pc.fillStyle = '#fff'; pc.fillRect(0, 0, 1, 1);
    greyPat = ctx.createPattern(p, 'repeat');
  }
  return greyPat;
}
function icon(name, x, y) { const im = img[name]; if (im) ctx.drawImage(im, Math.round(x), Math.round(y)); }
function iconAt(name, cx, y) { const im = img[name]; if (im) ctx.drawImage(im, Math.round(cx - im.width / 2), Math.round(y)); }

const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
function newDeck(size) {

let t = null;
function fresh() {
  t = { jokers: false, reversals: true, spread: false, cards: newDeck(52), tarot: newDeck(78),
    dice: { pick: [1, 1], value: [], rolled: false, totals: [] } };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(SAVE)); if (s && s.cards && s.tarot && s.dice) { t = s; return; } } catch (e) {}
  fresh();
}
function persist() { try { localStorage.setItem(SAVE, JSON.stringify(t)); } catch (e) {} }
function shuffle(which) {
  t[which] = newDeck(which === 'tarot' ? 78 : 52 + (t.jokers ? 2 : 0));
}
function draw(which, n) {
  const d = t[which];
  n = Math.min(n, d.order.length);
  if (!n) return;
  for (const c of d.current) { d.history.push(c); if (d.history.length > 5) d.history.shift(); }
  d.current = [];
  for (let i = 0; i < n; ++i) d.current.push({ id: d.order.pop(), rev: which === 'tarot' && t.reversals && rnd(2) === 1 });
}
function cardName(id, tarot) {
  if (tarot) return id < 22 ? MAJORS[id] : `${RANK_WORDS[(id - 22) % 14]} OF ${TAROT_SUITS[Math.floor((id - 22) / 14)]}`;
  if (id >= 52) return 'JOKER';
  return `${PLAY_RANKS[id % 13]} OF ${PLAY_SUITS[Math.floor(id / 13)]}`;
}
const total = d => d.value.reduce((a, b) => a + b, 0);
function roll() {
  const d = t.dice;
  if (!d.pick.length) return;
  if (d.rolled) { d.totals.push(total(d)); if (d.totals.length > 6) d.totals.shift(); }
  d.value = d.pick.map(k => 1 + rnd(SIDES[k]));
  d.rolled = true;
}
function formula(d) {
  const c = Array(7).fill(0); d.pick.forEach(k => c[k]++);
  return c.map((n, k) => n ? `${n}${DICE[k]}` : null).filter(Boolean).join(' + ');
}

/* ---------------- screens ---------------- */
let screen = 'menu';
const M = 16, BUTTONS_Y = 732, PILL_H = 52;
function go(s) { screen = s; render(); }
function act(fn) { return () => { fn(); persist(); render(); }; }

function header(title, right) {
  fill(0, 0, W, 76, '#000');
  say(M, 0, W - 2 * M, 80, title, 'display', 'left', true);
  if (right) say(M, 26, W - 2 * M, 56, right, 'ui', 'right', true);
  fill(0, 80, W, 3, '#000');
}
function chip(x, y, w, h, label, on, fn) {
  fill(x, y, w, h, on ? '#000' : '#fff', 10); stroke(x, y, w, h, '#000', 2, 10);
  say(x, y, w, h, label, 'button', 'center', on); hit(x, y, w, h, fn);
}
function pill(x, y, w, h, label, solid, fn) {
  fill(x, y, w, h, solid ? '#000' : '#fff', 10); if (!solid) stroke(x, y, w, h, '#000', 2, 10);
  say(x, y, w, h, label, 'ui', 'center', solid); hit(x, y, w, h, fn);
}
function bottomBar(middle, middleFn, last, lastFn, enabled) {
  const bx = M, bw = 64;
  fill(bx, BUTTONS_Y, bw, PILL_H, '#fff', 10); stroke(bx, BUTTONS_Y, bw, PILL_H, '#000', 2, 10);
  const cx = bx + bw / 2, cy = BUTTONS_Y + PILL_H / 2;
  for (let i = 0; i < 12; ++i) { fill(cx - 6 + i, cy - i - 1, 4, 3, '#000'); fill(cx - 6 + i, cy + i - 1, 4, 3, '#000'); }
  hit(bx, BUTTONS_Y, bw, PILL_H, () => go('menu'));
  const x = bx + bw + 12, room = W - M - x, half = Math.floor((room - 12) / 2);
  pill(x, BUTTONS_Y, half, PILL_H, middle, false, middleFn);
  const lx = x + half + 12, lw = room - half - 12;
  if (enabled) pill(lx, BUTTONS_Y, lw, PILL_H, last, true, lastFn);
  else { stroke(lx, BUTTONS_Y, lw, PILL_H, grey(), 2, 10); say(lx, BUTTONS_Y, lw, PILL_H, last, 'ui'); }
}
function cardFrame(x, y, w, h, edge = 3) { fill(x, y, w, h, '#fff', 12); stroke(x, y, w, h, '#000', edge, 12); }
function cardBack(x, y, w, h) {
  cardFrame(x, y, w, h);
  fill(x + 10, y + 10, w - 20, h - 20, grey(), 8); stroke(x + 10, y + 10, w - 20, h - 20, '#000', 2, 8);
}
const suitIcon = (s, size) => `${['spades', 'hearts', 'diamonds', 'clubs'][s]}_${size}`;

function bigPlaying(x, y, w, h, id) {
  cardFrame(x, y, w, h);
  if (id >= 52) { say(x, y + 14, w, 40, 'JOKER', 'display'); iconAt('joker_96', x + w / 2, y + (h - 96) / 2 + 10); return; }
  const r = RANK_SHORT[id % 13], s = Math.floor(id / 13);
  say(x + 10, y + 8, 72, 60, r, 'large');
  iconAt(suitIcon(s, 40), x + 46, y + 70);
  say(x + w - 82, y + h - 68, 72, 60, r, 'large');
  iconAt(suitIcon(s, 40), x + w - 46, y + h - 112);
  iconAt(suitIcon(s, 96), x + w / 2, y + (h - 96) / 2);
}
function miniPlaying(x, y, w, h, id) {
  cardFrame(x, y, w, h, 2);
  if (id >= 52) { say(x, y + 6, w, 26, 'JK', 'ui'); iconAt('joker_40', x + w / 2, y + h - 52); return; }
  say(x + 4, y + 6, w - 8, 30, RANK_SHORT[id % 13], 'display');
  iconAt(suitIcon(Math.floor(id / 13), 40), x + w / 2, y + h - 52);
}
const two = n => String(n).padStart(2, '0');
function tarotArt(c, size) {
  if (c.id < 22) return `major_${two(c.id)}_${size}${c.rev && size !== 48 ? '_r' : ''}`;
  const s = ['wands', 'cups', 'swords', 'pentacles'][Math.floor((c.id - 22) / 14)];
  const ss = size === 128 ? 128 : size === 88 ? 64 : 40;
  return `${s}_${ss}${c.rev && ss !== 40 ? '_r' : ''}`;
}
function tarotLabel(id) { return id < 22 ? ROMAN[id] : RANK_WORDS[(id - 22) % 14]; }
function tarotCard(x, y, w, h, c, big) {
  cardFrame(x, y, w, h);
  stroke(x + 7, y + 7, w - 14, h - 14, '#000', 1, 8);
  const ix = x + 7, iy = y + 7, iw = w - 14, ih = h - 14;
  const topH = big ? 40 : 30;
  say(ix, iy + 4, iw, topH, tarotLabel(c.id), big ? 'ui' : 'button');
  const nameH = big ? 56 : 44, nameTop = iy + ih - nameH - 2;
  const art = tarotArt(c, big ? 128 : 88);
  const im = img[art], artTop = iy + 4 + topH, room = nameTop - artTop;
  if (im) iconAt(art, x + w / 2, artTop + (room - im.height) / 2);
  const name = cardName(c.id, true);
  prose(ix + 4, nameTop, iw - 8, nameH, name, big ? fitFace(name, iw - 8, ['ui', 'button']) : 'tile');
}
function miniTarot(x, y, w, h, c) {
  cardFrame(x, y, w, h, 2);
  say(x + 2, y + 4, w - 4, 22, tarotLabel(c.id), 'tile');
  iconAt(tarotArt({ id: c.id, rev: false }, 48), x + w / 2, y + 30);
  if (c.rev) say(x + 2, y + h - 26, w - 4, 22, 'REV', 'tile');
}
function earlier(deck, tarot, top) {
  if (!deck.history.length) return;
  say(M, top, W - 2 * M, 22, 'EARLIER', 'tile', 'left');
  fill(M + 76, top + 10, W - 2 * M - 76, 2, '#000');
  const h = tarot ? 112 : 106;
  deck.history.slice().reverse().forEach((c, i) => {
    const x = M + 10 + i * 88;
    if (tarot) miniTarot(x, top + 30, 76, h, c); else miniPlaying(x, top + 30, 76, h, c.id);
  });
}
function die(x, y, k, text) {
  iconAt(`d${SIDES[k]}_96`, x + 48, y);
  say(x, y + (k === 0 ? 16 : 0), 96, 96, text, fitFace(text, 64, ['display', 'ui']));
}

function drawMenu() {
  header('TABLETOP');
  const tw = W - 2 * M, th = 196;
  for (let i = 0; i < 3; ++i) {
    const x = M, y = 100 + i * (th + 12);
    fill(x, y, tw, th, '#fff', 14); stroke(x, y, tw, th, '#000', 2, 14);
    hit(x, y, tw, th, () => go(['cards', 'tarot', 'dice'][i]));
    const tx = x + 170, tww = tw - 170 - 16;
    say(tx, y + 48, tww, 48, ['CARDS', 'TAROT', 'DICE'][i], 'display', 'left');
    let a, b;
    if (i === 0) {
      cardBack(x + 26, y + 28, 82, 116); cardFrame(x + 62, y + 52, 82, 116);
      say(x + 66, y + 58, 40, 34, 'A', 'display'); iconAt('spades_40', x + 103, y + 100);
      a = `${t.cards.order.length} of ${t.cards.size} left`; b = t.jokers ? 'With jokers' : 'No jokers';
    } else if (i === 1) {
      const cx = x + 36, cy = y + 18; cardFrame(cx, cy, 108, 160);
      say(cx, cy + 6, 108, 26, 'XVII', 'button'); iconAt('major_17_88', cx + 54, cy + 40);
      say(cx, cy + 130, 108, 24, 'THE STAR', 'tile');
      a = `${t.tarot.order.length} of 78 left`; b = t.spread ? 'Three-card spread' : 'One card at a time';
    } else {
      die(x + 24, y + 24, 5, '20');
      icon('d6_48', x + 96, y + 120); say(x + 96, y + 120, 48, 48, '6', 'ui');
      const d = t.dice;
      a = d.rolled ? `Last roll: ${total(d)}` : d.pick.length ? 'Ready to roll' : 'No dice picked'; b = formula(d);
    }
    say(tx, y + 100, tww, 30, a, 'ui', 'left');
    say(tx, y + 132, tww, 26, b, 'button', 'left');
  }
}
function drawCards() {
  const d = t.cards;
  header('CARDS', `${d.order.length} LEFT`);
  say(M, 96, 200, 44, `DECK OF ${d.size}`, 'button', 'left');
  chip(W - M - 190, 96, 190, 44, t.jokers ? 'JOKERS ON' : 'JOKERS OFF', t.jokers,
    act(() => { t.jokers = !t.jokers; shuffle('cards'); }));
  const cx = (W - 236) / 2, cy = 156;
  if (d.current.length) {
    bigPlaying(cx, cy, 236, 330, d.current[0].id);
    say(0, cy + 338, W, 36, cardName(d.current[0].id, false), 'ui');
  } else {
    cardBack(cx, cy, 236, 330);
    say(0, cy + 338, W, 36, d.order.length ? 'Shuffled. Tap DRAW.' : 'The deck is empty.', 'ui');
  }
  earlier(d, false, 540);
  bottomBar('SHUFFLE', act(() => shuffle('cards')), d.order.length ? 'DRAW' : 'EMPTY', act(() => draw('cards', 1)), d.order.length > 0);
}
function drawTarot() {
  const d = t.tarot;
  header('TAROT', `${d.order.length} LEFT`);
  chip(M, 96, 104, 44, 'ONE', !t.spread, act(() => { t.spread = false; }));
  chip(M + 112, 96, 104, 44, 'THREE', t.spread, act(() => { t.spread = true; }));
  chip(W - M - 200, 96, 200, 44, t.reversals ? 'REVERSED ON' : 'REVERSED OFF', t.reversals,
    act(() => { t.reversals = !t.reversals; }));
  if (!d.current.length) {
    const x = (W - 236) / 2, y = 156;
    cardBack(x, y, 236, 360); iconAt('major_10_88', x + 118, y + (360 - 88) / 2);
    say(0, y + 366, W, 30, d.order.length ? 'Shuffled. Tap DRAW.' : 'The deck is empty.', 'ui');
  } else if (d.current.length === 1) {
    const x = (W - 236) / 2, y = 156;
    tarotCard(x, y, 236, 360, d.current[0], true);
    if (d.current[0].rev) say(0, y + 366, W, 30, 'REVERSED', 'ui');
  } else {
    const kw = 140, gap = (W - 3 * kw - 2 * M) / 2;
    d.current.forEach((c, i) => {
      const x = M + i * (kw + gap);
      say(x, 150, kw, 28, ['PAST', 'PRESENT', 'FUTURE'][i], 'button');
      tarotCard(x, 182, kw, 262, c, false);
      if (c.rev) say(x, 450, kw, 26, 'REVERSED', 'tile');
    });
  }
  earlier(d, true, 556);
  const want = t.spread ? 3 : 1, left = d.order.length;
  bottomBar('SHUFFLE', act(() => shuffle('tarot')), left >= want ? (t.spread ? 'DRAW 3' : 'DRAW') : left ? 'DRAW' : 'EMPTY',
    act(() => draw('tarot', want)), left > 0);
}
function drawDice() {
  const d = t.dice;
  header('DICE', d.pick.length ? `${d.pick.length} DICE` : null);
  const counts = Array(7).fill(0); d.pick.forEach(k => counts[k]++);
  const cw = 58, gap = (W - 2 * M - 7 * cw) / 6;
  for (let k = 0; k < 7; ++k) {
    const x = M + k * (cw + gap), y = 96;
    fill(x, y, cw, 86, '#fff', 10); stroke(x, y, cw, 86, '#000', 2, 10);
    icon(`d${SIDES[k]}_48`, x + 5, y + 6);
    say(x, y + 56, cw, 26, DICE[k], fitFace(DICE[k], cw - 8, ['button', 'tile']));
    hit(x, y, cw, 86, act(() => { if (d.pick.length < 12) { d.pick.push(k); d.rolled = false; } }));
    if (counts[k]) { fill(x + cw - 22, y - 8, 28, 28, '#000', 14); say(x + cw - 22, y - 8, 28, 28, String(counts[k]), 'tile', 'center', true); }
  }
  const f = formula(d);
  if (!d.pick.length) { say(0, 204, W, 60, 'Pick some dice', 'display'); say(0, 266, W, 26, 'Tap a die above to add it', 'button'); }
  else if (d.rolled) { say(0, 196, W, 70, String(total(d)), 'large'); say(0, 266, W, 26, f, 'button'); }
  else { say(0, 204, W, 60, f, 'display'); say(0, 266, W, 26, 'Tap ROLL', 'button'); }
  d.pick.forEach((k, i) => {
    const row = Math.floor(i / 4), col = i % 4, inRow = Math.min(4, d.pick.length - row * 4);
    const x = (W - (inRow * 96 + (inRow - 1) * 16)) / 2 + col * 112, y = 306 + row * 112;
    die(x, y, k, d.rolled ? String(d.value[i]) : '?');
    hit(x, y, 96, 96, act(() => { d.pick.splice(i, 1); d.value.splice(i, 1); if (!d.pick.length) d.rolled = false; }));
  });
  if (d.totals.length) say(M, 650, W - 2 * M, 30, 'EARLIER  ' + d.totals.slice().reverse().join('  '), 'button');
  bottomBar('CLEAR', act(() => { d.pick = []; d.value = []; d.rolled = false; }), 'ROLL', act(roll), d.pick.length > 0);
}

function render() {
  hits = [];
  fill(0, 0, W, H, '#fff');
  ({ menu: drawMenu, cards: drawCards, tarot: drawTarot, dice: drawDice })[screen]();
  const im = ctx.getImageData(0, 0, W, H), p = im.data;
  for (let i = 0; i < p.length; i += 4) {
    const v = (p[i] * 299 + p[i + 1] * 587 + p[i + 2] * 114) / 1000 < 128 ? 0 : 255;
    p[i] = p[i + 1] = p[i + 2] = v; p[i + 3] = 255;
  }
  ctx.putImageData(im, 0, 0);
}

function fit() {
  const bare = matchMedia('(max-width: 600px), (display-mode: standalone)').matches;
  const scale = bare ? Math.min(window.innerWidth / W, (window.innerHeight - 8) / H)
                     : Math.min((window.innerWidth - 40) / W, (window.innerHeight - 60) / H, 1.25);
  cv.style.width = Math.floor(W * scale) + 'px'; cv.style.height = Math.floor(H * scale) + 'px';
  cv.style.imageRendering = scale >= 1 ? 'pixelated' : 'auto';
}
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  for (let i = hits.length - 1; i >= 0; --i) {
    const h = hits[i];
    if (x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h) { h.fn(); return; }
  }
});
window.addEventListener('resize', fit);

load();
Promise.all([
  ...Object.entries(ICONS).map(([k, src]) => new Promise(res => { const i = new Image(); i.onload = () => { img[k] = i; res(); }; i.onerror = res; i.src = src; })),
  document.fonts.load('20px Rubik', 'TABLETOP 0123456789'),
]).then(() => {
  fit();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    const hadCopy = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadCopy || reloaded) return;
      reloaded = true; persist(); location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  render();
});
</script>
